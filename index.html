<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aero Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            padding: 20px;
        }
        
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .tile {
            background-color: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .tile:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(255, 255, 255, 0.1);
        }
        
        .tile:active {
            transform: translateY(-4px);
        }
        
        .thumbnail {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background-color: #333;
        }
        
        .tile-content {
            padding: 16px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .title {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        
        .description {
            color: #999;
            font-size: 13px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="container" id="tilesContainer"></div>
    
    <script>
        const tileData = [
            {
                id: 1,
                thumbnail: 'https://codepy5.github.io/AeroCards/images/example-christmas.png',
                title: 'Example - Christmas',
                description: 'Showcases the Spotify music integration',
                url: 'https://codepy5.github.io/AeroCards/example-christmas'
            },
            {
                id: 2,
                thumbnail: 'https://codepy5.github.io/AeroCards/images/example-prom.png',
                title: 'Example - Prom',
                description: 'Showcases vivid color layers',
                url: 'https://codepy5.github.io/AeroCards/example-prom'
            }
        ];
        
        function renderTiles(tiles) {
            const container = document.getElementById('tilesContainer');
            container.innerHTML = '';
            
            tiles.forEach(tile => {
                const tileElement = document.createElement('div');
                tileElement.className = 'tile';
                tileElement.innerHTML = `
                    <img src="${tile.thumbnail}" alt="${tile.title}" class="thumbnail">
                    <div class="tile-content">
                        <div class="title">${tile.title}</div>
                        <div class="description">${tile.description}</div>
                    </div>
                `;
                
                tileElement.addEventListener('click', () => {
                    window.location.href = tile.url;
                });
                
                container.appendChild(tileElement);
            });
        }
        
        // Render tiles on page load
        renderTiles(tileData);
    </script>
</body>
</html>
