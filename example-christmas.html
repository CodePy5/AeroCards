<script>

list = list.split("$");
var speed = 20;

const delay = ms => new Promise(res => setTimeout(res, ms));

function typeWriter(txt, id, i) {
  if (i < txt.length) {
    document.getElementById(id).innerHTML += txt.charAt(i);
    i++;
    setTimeout(function(){
            typeWriter(txt, id, i);
    }, speed);
  }
}


async function main(){
        await delay(5000);
        for (var x = 0; x < list.length; x++){
                var i = 0;
                if (x < 3){
                        $("body").append("<pre class='yellow' id='" + x + "'></pre>");
                }
                else if (x > 21){
                        $("body").append("<pre class='brown' id='" + x + "'></pre>");
                }
                else{
                        $("body").append("<pre id='" + x + "'></pre>");
                }
                typeWriter(list[x], x, i);
                await delay(500);
        }
        await delay(15000);
        $("body").append("<br>");
        $("body").append("<br>");
        $("body").append("<pre id='sudo'></pre>");
        typeWriter("> sudo be_merry.sh", "sudo", 0);
}


$("#start").click(function(){
  const spotifyEmbedWindow = document.querySelector('iframe[src*="spotify.com/embed"]').contentWindow;
  spotifyEmbedWindow.postMessage({command: 'toggle'}, '*');
  $("#start").remove();
  main();
});
